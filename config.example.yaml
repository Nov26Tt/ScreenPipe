# ============================================================
# ScreenPipe 配置文件模板
#
# 用法：复制本文件为 config.yaml 后填入自己的配置。
#       config.yaml 已被 .gitignore 忽略，不会提交到仓库。
# 全部配置项及默认值见 README。
# ============================================================

capture:
  # 自动截图间隔（秒）。屏幕内容无变化时会自动跳过模型调用，
  # 因此这个值可以设得比较小而不担心烧 Token。
  interval: 10

  # JPEG 压缩质量（1-95）。越低体积越小、传输越快，但小字会变糊。
  # 截图以 base64 内联进请求体，质量过低会直接影响 OCR 准确率。
  quality: 60

  # 截图落盘目录。留空则使用项目下的 screenshots/。
  save_dir: ""

  # 区域预设：full / left_half / right_half / center
  # 只截目标区域能显著降低图片体积与识别噪音。
  #   left_half  适合「左文档 / 右 AI」的并排布局
  #   center     只截中间 1200x800
  # 预设由程序按当前显示器分辨率实时计算，无需手填坐标。
  region_preset: full

  # 需要精确控制时，用region 覆盖上面的预设。
  # 格式：[left, top, width, height]；注释掉则截取主显示器全屏。
  # region: [0, 0, 1920, 1080]

history:
  # 保留的解析记录条数（内存与数据库同此上限，超出后淘汰最旧的）。
  max_records: 200

retention:
  # 截图保留策略：两个阈值任一超出即清理最旧的文件。
  #   max_days   按时间，删掉超过这个天数的老截图
  #   max_files  按数量，保证高频运行时磁盘不会失控
  # 两者并存的理由：只按天数则单日文件数可能仍很大；
  # 只按数量则低频运行时磁盘占用会持续数月不回。
  max_days: 7
  max_files: 500

storage:
  # 解析记录的 SQLite 数据库路径。留空则使用项目下的 records.db。
  # 标准库自带，无需额外安装；文件已被 .gitignore 忽略。
  db_path: ""

llm:
  # 任意 OpenAI 兼容地址。程序会在其后拼接 /chat/completions。
  # 默认用 DeepSeek：deepseek-flash（实为 V4.1-Flash）原生支持图片输入，
  # 上下文 1M。换成智谱 / 阿里百炼 / 火山方舟 / Moonshot / 本地 Ollama
  # 只需改这里和 model。
  api_base: https://api.deepseek.com/v1
  api_key: your-api-key-here
  # 必须是支持图片输入的视觉（多模态）模型，纯文本模型无法处理截图。
  # 免费可选：deepseek-flash、glm-4.6v-flash
  # 付费可选：glm-4.6v / qwen3-vl-plus / doubao-seed-2-0-lite / kimi-k2.6
  # 本地可选：qwen3-vl:8b（经 Ollama，图片不出本机）
  model: deepseek-flash

  # 留空则使用 llm_client.py 中的内置提示词。
  # 想要固定输出格式时在这里覆盖它。
  system_prompt: ""

  # 开启后强制模型返回 JSON，结果可被程序直接消费而不只是给人阅读。
  # 提示词需与之一致（要求模型输出 JSON 结构）。
  # 注意：并非所有服务都支持 response_format，遇到 400 时把它关掉即可。
  json_mode: false

server:
  # 监听地址。手机要访问就必须保持 0.0.0.0。
  # 提醒：服务无内置认证，请勿直接暴露到公网。
  host: 0.0.0.0
  # 默认端口，已避开 8000 / 8080 / 3000 等常见开发端口。
  # 被占用时程序会自动向后探测并打印实际端口。
  port: 8765
