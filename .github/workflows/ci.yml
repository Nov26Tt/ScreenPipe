name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    # 本项目依赖 mss 截屏与 start.bat，只在 Windows 上可运行，
    # 因此矩阵只覆盖 Python 版本维度，不铺 Linux —— 铺了也只是空跑。
    # 想在 Linux 上复用核心逻辑的话，capture.Capture 已经是惰性初始化，
    # 无显示器时可以正常构造（见 has_display()），但截屏用例仍会失败。
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v --tb=short

  # 密钥泄露是本项目最敏感的红线：服务监听 0.0.0.0 且无认证，
  # 任何人都能访问 /api/config。单独跑一个 job 兜底。
  secret-scan:
    name: Secret leak guard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Ensure no config file is tracked
        run: |
          if git ls-files --error-unmatch config.yaml 2>$null; then
            echo "::error::config.yaml 不应被提交到仓库"
            exit 1
          }
          echo "config.yaml 未被跟踪，符合预期"

      - name: Scan tracked files for hardcoded keys
        run: |
          $pattern = '(sk-[A-Za-z0-9]{16,}|ghp_[A-Za-z0-9]{36}|AKIA[A-Z0-9]{16})'
          $hits = git grep -nEI $pattern -- . ':!tests/' ':!*.md'
          if ($hits) {
            Write-Output "::error::检测到疑似硬编码密钥，请改用 config.yaml 或环境变量"
            Write-Output $hits
            exit 1
          }
          echo "未检测到硬编码密钥"