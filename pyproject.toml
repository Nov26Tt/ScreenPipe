[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "screenpipe"
version = "1.1.0"
description = "将屏幕上的内容实时转换为结构化文本：捕获 → 变更检测 → 视觉模型理解 → 实时推送"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TuT" }]
keywords = [
    "vision-language-model",
    "screen-capture",
    "screenshot",
    "ocr",
    "fastapi",
    "websocket",
    "multimodal",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Capture",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "mss>=9.0.0",
    "pillow>=10.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "httpx>=0.25.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "httpx>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/Nov26Tt/ScreenPipe"
Repository = "https://github.com/Nov26Tt/ScreenPipe"
Issues = "https://github.com/Nov26Tt/ScreenPipe/issues"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
